<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Post Maker">
<title>Post Maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5cff'/%3E%3Cpath d='M20 44V20h8l4 10 4-10h8v24h-6V31l-4 10h-4l-4-10v13z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --text:#14161f; --muted:#667085; --line:#e4e7ee;
  --brand:#0b5cff; --brand-ink:#ffffff; --ok:#12805c; --err:#c0341d; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d0f15; --card:#161a23; --text:#eef0f6; --muted:#98a2b3; --line:#262b38; --brand:#4d85ff; --brand-ink:#08101f; --ok:#4ac29a; --err:#ff8b77; --chip:#1b2340; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.field{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span:after{transform:translateX(22px)}
.hint{color:var(--muted);font-size:13px;margin:2px 0 0}
button.primary{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button.primary:disabled{opacity:.6}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.status{display:none;align-items:center;gap:10px;font-size:15px}
.status.show{display:flex}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:s 1s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.result{white-space:pre-wrap;word-wrap:break-word}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--brand);margin-bottom:8px}
.badge.ok{color:var(--ok)} .badge.err{color:var(--err)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hist-item{border-top:1px solid var(--line);padding:12px 0;cursor:pointer}
.hist-item:first-child{border-top:0}
.hist-item b{display:block}
.hist-item small{color:var(--muted)}
dialog{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;width:min(92vw,520px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.err-text{color:var(--err)}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Post Maker</h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings">⚙︎</button>
  </header>
  <p class="sub">Type a topic. Your workflow writes the post and image.</p>

  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="topic">Post topic</label>
      <input id="topic" placeholder="e.g. Diwali celebration" required>
      <div class="chips" id="chips"></div>
    </div>
    <div class="field">
      <label for="audience">Target audience</label>
      <input id="audience" placeholder="e.g. working professionals" required>
    </div>
    <div class="field">
      <div class="row">
        <div>
          <label for="publish" style="margin:0">Publish to LinkedIn</label>
          <p class="hint">Turning this off only works after you add the optional IF step from the guide.</p>
        </div>
        <label class="switch"><input type="checkbox" id="publish" aria-label="Publish to LinkedIn" checked><span></span></label>
      </div>
    </div>
    <button class="primary" id="go" type="submit">Create post</button>
  </form>

  <div class="card status" id="status" role="status"><div class="spin"></div><div id="statusText">Working…</div></div>

  <div class="card" id="resultCard" style="display:none">
    <div class="badge" id="badge"></div>
    <div class="result" id="result"></div>
    <div class="actions">
      <button class="ghost" id="copy">Copy text</button>
      <button class="ghost" id="again">Try again</button>
    </div>
  </div>

  <div class="card" id="histCard" style="display:none">
    <div class="row" style="margin-bottom:6px"><b>Recent</b><button class="ghost" id="clearHist">Clear</button></div>
    <div id="hist"></div>
  </div>
</div>

<dialog id="settings">
  <h2 style="margin:0 0 4px;font-size:18px">Settings</h2>
  <p class="hint" style="margin-bottom:14px">Saved only on this phone.</p>
  <div class="field">
    <label for="url">Webhook URL</label>
    <input id="url" inputmode="url" placeholder="https://your-n8n.com/webhook/linkedin-post">
  </div>
  <div class="field">
    <label for="key">Access key (optional)</label>
    <input id="key" type="password" placeholder="Same value as in your n8n Header Auth">
  </div>
  <div class="actions" style="margin-top:6px">
    <button class="primary" id="saveSettings" type="button" style="width:auto;padding:0 22px">Save</button>
    <button class="ghost" id="closeSettings" type="button">Close</button>
  </div>
</dialog>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function load(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

  var DEFAULT_URL = "";   // optional: paste your production webhook URL here
  var topics = ["Diwali celebration","Workplace wellbeing","AI at work","Leadership lessons","Career growth"];

  // chips
  topics.forEach(function(t){
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = function(){ $("topic").value = t; };
    $("chips").appendChild(b);
  });

  // restore
  $("audience").value = load("audience", "");
  $("publish").checked = load("publish", "1") === "1";
  $("url").value = load("url", DEFAULT_URL);
  $("key").value = load("key", "");

  // settings dialog
  var dlg = $("settings");
  function openDlg(){ if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open",""); }
  function closeDlg(){ if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  $("openSettings").onclick = openDlg;
  $("closeSettings").onclick = closeDlg;
  $("saveSettings").onclick = function(){
    save("url", $("url").value.trim()); save("key", $("key").value.trim()); closeDlg();
  };
  if (!$("url").value) setTimeout(openDlg, 300);

  // history
  function getHist(){ try { return JSON.parse(load("hist","[]")); } catch(e){ return []; } }
  function renderHist(){
    var h = getHist(), box = $("hist"); box.innerHTML = "";
    $("histCard").style.display = h.length ? "block" : "none";
    h.forEach(function(it){
      var d = document.createElement("div"); d.className = "hist-item";
      var b = document.createElement("b"); b.textContent = it.topic;
      var s = document.createElement("small"); s.textContent = new Date(it.at).toLocaleString() + " · " + it.status;
      d.appendChild(b); d.appendChild(s);
      d.onclick = function(){ show(it.status, it.text); window.scrollTo({top:0,behavior:"smooth"}); };
      box.appendChild(d);
    });
  }
  $("clearHist").onclick = function(){ save("hist","[]"); renderHist(); };
  renderHist();

  function show(kind, text){
    $("resultCard").style.display = "block";
    var b = $("badge"); b.className = "badge " + (kind === "error" ? "err" : "ok");
    b.textContent = kind === "error" ? "Something went wrong" : (kind === "posted" ? "Posted to LinkedIn" : "Done");
    $("result").textContent = text;
  }

  function setBusy(on, msg){
    $("go").disabled = on;
    $("status").classList.toggle("show", on);
    if (msg) $("statusText").textContent = msg;
  }

  $("copy").onclick = function(){
    var t = $("result").textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ $("copy").textContent = "Copied"; setTimeout(function(){ $("copy").textContent = "Copy text"; }, 1500); });
  };
  $("again").onclick = function(){ $("resultCard").style.display = "none"; $("topic").focus(); };

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var url = $("url").value.trim();
    if (!url){ openDlg(); return; }
    var topic = $("topic").value.trim(), audience = $("audience").value.trim(), publish = $("publish").checked;
    save("audience", audience); save("publish", publish ? "1" : "0");
    $("resultCard").style.display = "none";
    setBusy(true, "Writing the post and creating the image… this can take a minute.");

    var headers = { "Content-Type": "application/json" };
    var key = $("key").value.trim(); if (key) headers["x-api-key"] = key;
    var ctrl = new AbortController(); var timer = setTimeout(function(){ ctrl.abort(); }, 240000);

    fetch(url, { method: "POST", headers: headers, signal: ctrl.signal,
      body: JSON.stringify({ postTopic: topic, targetAudience: audience, publish: publish }) })
    .then(function(r){ return r.text().then(function(t){ return { ok: r.ok, status: r.status, text: t }; }); })
    .then(function(res){
      var data = null; try { data = JSON.parse(res.text); } catch(e){}
      if (!res.ok){ throw new Error((data && (data.message || data.error)) || ("Server returned " + res.status)); }
      var text = data ? (data.post || data.text || data.message || JSON.stringify(data, null, 2)) : res.text;
      var status = (data && data.status) || "done";
      show(status, text);
      var h = getHist(); h.unshift({ topic: topic, text: text, status: status, at: Date.now() }); save("hist", JSON.stringify(h.slice(0, 15))); renderHist();
    })
    .catch(function(err){
      var m = err.name === "AbortError" ? "It took too long. Check n8n Executions, the workflow may still be running."
        : (String(err.message).indexOf("Failed to fetch") > -1 ? "Could not reach your webhook. Check the URL, that the workflow is active, and the CORS setting (see the guide)." : err.message);
      show("error", m);
    })
    .finally(function(){ clearTimeout(timer); setBusy(false); });
  });
})();
</script>
</body>
</html>
